name: Custom Rom Builder Samsung Galaxy A03
permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      GSI:
        description: "GSI Image Direct Link"
        required: true
        default: "https://sourceforge.net/projects/andyyan-gsi/files/lineage-21-pre-qpr2-td/lineage-21.0-20260614-UNOFFICIAL-arm64_bgN-signed.img.gz/download"

      NAME:
        description: "Rom Name"
        required: true
        default: "LineageOS-21-Non-VNDKLite"

      VERSION:
        description: "Baseband Version"
        required: true
        default: "A035FXXS9CYG1"

      VENDOR:
        description: "Direct Link Of Your Vendor Image"
        required: true
        default: "https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/vendor.img"

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            xz-utils \
            unzip \
            p7zip-full \
            wget \
            curl \
            file \
            android-sdk-libsparse-utils

      - name: Installing Tools
        run: |
          set -e
          git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
          cd lpbinary
          bash install.sh

      - name: Downloading Your GSI And Extracting
        env:
          GSI_URL: ${{ inputs.GSI || 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-21-pre-qpr2-td/lineage-21.0-20260614-UNOFFICIAL-arm64_bgN-signed.img.gz/download' }}
        run: |
          set -e
          cd lpbinary/binary

          echo "Downloading GSI..."
          wget --max-redirect=20 -O gsi_archive "$GSI_URL"

          mkdir -p sys

          if unzip -t gsi_archive >/dev/null 2>&1; then
            echo "GSI detected as ZIP"
            unzip -o gsi_archive -d sys/

          elif file gsi_archive | grep -qi 'gzip'; then
            echo "GSI detected as GZIP"
            gzip -dc gsi_archive > sys/gsi.img

          elif file gsi_archive | grep -qi 'XZ'; then
            echo "GSI detected as XZ"
            xz -dc gsi_archive > sys/gsi.img

          elif file gsi_archive | grep -qi 'Android sparse'; then
            echo "GSI detected as Android sparse image"
            simg2img gsi_archive sys/gsi.img

          elif file gsi_archive | grep -qi 'filesystem'; then
            echo "GSI detected as a raw image"
            cp gsi_archive sys/gsi.img

          else
            echo "::error::Unsupported GSI format or invalid download"
            file gsi_archive
            head -c 300 gsi_archive || true
            exit 1
          fi

          if [ -f sys/system.img ]; then
            mv sys/system.img system.img
          else
            IMG=$(find sys -maxdepth 2 -type f -name "*.img" | head -n 1)

            if [ -z "$IMG" ]; then
              echo "::error::No system image found"
              find sys -type f
              exit 1
            fi

            cp "$IMG" system.img
          fi

          rm -rf sys gsi_archive

          test -s system.img

          echo "GSI prepared successfully:"
          ls -lh system.img
          file system.img

      - name: Preparing Files
        env:
          VENDOR_URL: ${{ inputs.VENDOR || 'https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/vendor.img' }}
        run: |
          set -e
          cd lpbinary/binary

          echo "Downloading vendor.img..."
          wget --max-redirect=20 -O vendor.img "$VENDOR_URL"

          echo "Downloading product.img..."
          wget --max-redirect=20 -O product.img \
            "https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/product.img/download"

          echo "Downloading system_ext.img..."
          wget --max-redirect=20 -O system_ext.img \
            "https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/system_ext.img/download"
[20/10/2026 00:48] El-Fateh II: echo "Checking downloaded files..."

          for IMG in system.img vendor.img product.img system_ext.img; do
            if [ ! -s "$IMG" ]; then
              echo "::error::Missing or empty image: $IMG"
              exit 1
            fi

            echo "File information: $IMG"
            ls -lh "$IMG"
            file "$IMG"
          done

          echo "All required images are present."

      - name: Packing
        run: |
          set -e
          cd lpbinary/binary

          SYSTEM_SIZE=$(stat -c%s system.img)
          VENDOR_SIZE=$(stat -c%s vendor.img)
          PRODUCT_SIZE=$(stat -c%s product.img)
          SYSTEM_EXT_SIZE=$(stat -c%s system_ext.img)

          echo "System size: ${SYSTEM_SIZE}"
          echo "Vendor size: ${VENDOR_SIZE}"
          echo "Product size: ${PRODUCT_SIZE}"
          echo "System_ext size: ${SYSTEM_EXT_SIZE}"

          ./lpmake \
            --metadata-size 65536 \
            --super-name super \
            --metadata-slots 3 \
            --device super:6763315200 \
            --group main:6761218048 \
            --partition system:readonly:${SYSTEM_SIZE}:main \
            --image system=system.img \
            --partition vendor:readonly:${VENDOR_SIZE}:main \
            --image vendor=vendor.img \
            --partition product:readonly:${PRODUCT_SIZE}:main \
            --image product=product.img \
            --partition system_ext:readonly:${SYSTEM_EXT_SIZE}:main \
            --image system_ext=system_ext.img \
            --sparse \
            --output super.img

          echo "super.img created successfully:"
          ls -lh super.img

      - name: Creating tar and compressing to 7z
        env:
          ROM_NAME: ${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}
        run: |
          set -e
          cd lpbinary/binary

          echo "Creating super.tar..."
          tar -cvf super.tar super.img

          echo "Creating 7z archive..."
          7z a "${ROM_NAME}.7z" super.tar

          echo "Final ROM:"
          ls -lh "${ROM_NAME}.7z"

      - name: Verify ROM archive
        env:
          ROM_NAME: ${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}
        run: |
          set -e
          FILE="lpbinary/binary/${ROM_NAME}.7z"

          if [ ! -s "$FILE" ]; then
            echo "::error::ROM archive not found or empty"
            exit 1
          fi

          echo "ROM archive size:"
          ls -lh "$FILE"

          echo "Exact size in bytes:"
          stat -c '%s' "$FILE"

          echo "Verifying 7z archive..."
          7z t "$FILE"

          echo "Archive verification completed successfully."

      - name: Upload ROM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}-${{ github.run_id }}
          path: lpbinary/binary/${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}.7z
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: lpbinary/binary/${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}.7z
          name: ${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}-${{ github.run_id }}
          tag_name: build-${{ github.run_id }}
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Device: Samsung Galaxy A03 (SM-A035F)
            Version: ${{ inputs.VERSION || 'A035FXXS9CYG1' }}
            ROM Name: ${{ inputs.NAME || 'LineageOS-21-Non-VNDKLite' }}

            Installation:
            Extract the 7z archive and flash super.tar through Odin in the AP section.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -f lpbinary/binary/super.img
          rm -f lpbinary/binary/super.tar
