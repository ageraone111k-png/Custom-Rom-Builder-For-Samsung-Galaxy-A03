
name: Custom Rom Builder Samsung Galaxy A03

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:

      GSI:
        description: 'GSI Image Direct Link'
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-21-pre-qpr2-td/lineage-21.0-20260614-UNOFFICIAL-arm64_bgN-signed.img.gz/download'

      NAME:
        description: 'Rom Name'
        required: true
        default: 'LineageOS-21-Non-VNDKLite'

      VERSION:
        description: 'Baseband Version'
        required: true
        default: 'A035FXXS9CYG1'

      VENDOR:
        description: 'Enter Direct Link Of Your Version Vendor'
        required: true
        default: 'https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/vendor.img'

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget file android-sdk-libsparse-utils

    - name: Installing Tools
      run: |
        git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
        cd lpbinary
        bash install.sh

    - name: Downloading Your GSI And Extracting
      run: |
        cd lpbinary/binary

        echo "Downloading GSI..."
        wget -O gsi_archive "${{ github.event.inputs.GSI }}"

        mkdir -p sys

        if unzip -t gsi_archive >/dev/null 2>&1; then
          echo "GSI detected as ZIP"
          unzip gsi_archive -d sys/

        elif file gsi_archive | grep -qi 'gzip'; then
          echo "GSI detected as GZIP"
          mv gsi_archive sys/gsi.img.gz
          cd sys
          gunzip gsi.img.gz
          cd ..

        elif file gsi_archive | grep -qi 'XZ'; then
          echo "GSI detected as XZ"
          mv gsi_archive sys/gsi.img.xz
          cd sys
          unxz gsi.img.xz
          cd ..

        else
          echo "ERROR: Unsupported GSI format!"
          file gsi_archive
          exit 1
        fi

        if [ -f sys/system.img ]; then
          mv sys/system.img system.img
        else
          IMG=$(find sys -maxdepth 1 -type f -name "*.img" | head -n 1)

          if [ -z "$IMG" ]; then
            echo "ERROR: No system.img found!"
            find sys -type f
            exit 1
          fi

          mv "$IMG" system.img
        fi

        rm -rf sys gsi_archive

        echo "GSI prepared successfully:"
        ls -lh system.img

    - name: Preparing Files
      run: |
        cd lpbinary/binary

        echo "Downloading vendor.img..."
        wget -O vendor.img "${{ github.event.inputs.VENDOR }}"

        echo "Downloading product.img..."
        wget -O product.img "https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/product.img"

        echo "Downloading system_ext.img..."
        wget -O system_ext.img "https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/system_ext.img"

        echo "Checking downloaded files..."
        ls -lh system.img vendor.img product.img system_ext.img

        test -s system.img
        test -s vendor.img
        test -s product.img
        test -s system_ext.img

        echo "All required images are present."

    - name: Packing
      run: |
        cd lpbinary/binary

        SYSTEM_SIZE=$(stat -c%s system.img)
        VENDOR_SIZE=$(stat -c%s vendor.img)
        PRODUCT_SIZE=$(stat -c%s product.img)
        SYSTEM_EXT_SIZE=$(stat -c%s system_ext.img)

        echo "System size: ${SYSTEM_SIZE}"
        echo "Vendor size: ${VENDOR_SIZE}"
        echo "Product size: ${PRODUCT_SIZE}"
        echo "System_ext size: ${SYSTEM_EXT_SIZE}"

        ./lpmake \
          --metadata-size 65536 \
          --super-name super \
          --metadata-slots 3 \
          --device super:6763315200 \
          --group main:6761218048 \
          --partition system:readonly:${SYSTEM_SIZE}:main \
          --image system=system.img \
          --partition vendor:readonly:${VENDOR_SIZE}:main \
          --image vendor=vendor.img \
          --partition product:readonly:${PRODUCT_SIZE}:main \
          --image product=product.img \
          --partition system_ext:readonly:${SYSTEM_EXT_SIZE}:main \
          --image system_ext=system_ext.img \
          --sparse \
          --output super.img

        echo "super.img created successfully:"
        ls -lh super.img

    - name: Creating tar and compressing to 7z
      run: |
        cd lpbinary/binary

        echo "Creating super.tar..."
        tar -cvf super.tar super.img

        echo "Creating 7z archive..."
        7z a "${{ github.event.inputs.NAME }}.7z" super.tar

        echo "Final ROM:"
        ls -lh "${{ github.event.inputs.NAME }}.7z"

    - name: Upload ROM as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-21-Non-VNDKLite
        path: lpbinary/binary/${{ github.event.inputs.NAME }}.7z
        if-no-files-found: error
        retention-days: 7

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: lpbinary/binary/${{ github.event.inputs.NAME }}.7z
        name: ${{ github.event.inputs.NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Device: Samsung Galaxy A03
          Version: ${{ github.event.inputs.VERSION }}
          Rom Name: ${{ github.event.inputs.NAME }}

          Flash:
          Extract the 7z file and flash super.tar through ODIN in AP Section.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup
      run: |
        rm -rf lpbinary/binary/super.img
        rm -rf lpbinary/binary/super.tar

